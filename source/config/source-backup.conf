# /etc/source-backup.conf
STAGING_ROOT="/var/lib/source-backup"
EXPORT_ROOT="${STAGING_ROOT}/export"

BACKUP_MAILDIR="yes"
BACKUP_SITES="yes"
BACKUP_DOCKER="yes"
BACKUP_MARIADB="yes"
BACKUP_POSTGRESQL="no"

ZSTD_LEVEL="10"
EXTRA_PATHS_FILE="/etc/source-backup-extra-paths"

# Filesystem paths copied into the export tree.
BASE_PATHS=(
  /etc
  /usr/local
  /root/certificate-client-example
  /etc/certificate-example
  /var/spool/cron
  /var/lib/mail-policy-example
  /var/lib/mail-signing-example
  /var/lib/mail-validation-example
  /var/mail-filter-example
  /usr/lib/mail-processing-example
  /home/example-user/scripts
  /home/example-user/sieve
  /home/example-user/sieve-available
  /home/example-user/.ssh
)
