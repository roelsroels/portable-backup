FRAMEWORK_VERSION="restic-1.0"

WORK_ROOT="/var/lib/portable-backup"
STAGING_ROOT="${WORK_ROOT}/staging"
LOCK_ROOT="/run/lock"

ZSTD_LEVEL="10"

# Run a repository data check after each backup. "read-data-subset=5%" is
# thorough enough for daily use without reading the entire repository.
RESTIC_CHECK_SUBSET="5%"

# Backup report email settings
REPORT_EMAIL="operator@example.invalid"
REPORT_FROM="backup@coordinator.example.invalid"
REPORT_SUBJECT_PREFIX="[Portable Backup Report]"
# Alert when Backup storage usage exceeds this percentage
# Backup storage capacity thresholds
STORAGE_ALERT_PERCENT=80
STORAGE_CRITICAL_PERCENT=90
