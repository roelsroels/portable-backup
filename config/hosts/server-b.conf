HOST_NAME="server-b"
MODE="local"

RESTIC_REPOSITORY="/mnt/backup-storage/backups/restic/server-b"
RESTIC_PASSWORD_FILE="/root/.config/restic/server-b-password"

KEEP_DAILY=5
KEEP_WEEKLY=2
KEEP_MONTHLY=3
MAX_AGE_HOURS=30

BACKUP_MARIADB="auto"
BACKUP_POSTGRESQL="auto"
BACKUP_MONGODB="auto"
BACKUP_DOCKER="auto"

INCLUDE_PATHS=(
  /etc
  /usr/local
  /root
  /home
  /opt
  /srv
  /var/spool/cron
  /var/lib/application-a
  /var/lib/application-b
  /var/lib/application-c
  /var/lib/application-d
  /var/lib/mail-queue-example
  /var/lib/application-e
  /var/lib/application-f
)

# Prevent recursion and avoid transient/cache trees.
EXCLUDE_PATHS=(
  /storage
  /backups
  /mnt
  /media
  /var/cache
  /var/tmp
  /tmp
  /var/lib/docker
  /var/lib/containerd
  /var/lib/snapd/cache
  /home/example-user/.cache
)

# Optional legacy data. Disable after verified Restic snapshots exist.
BACKUP_LEGACY_DOCKER_BACKUPS="yes"
EXTRA_PATHS=(
  /srv/legacy-container-exports
)
