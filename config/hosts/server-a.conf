HOST_NAME="server-a"
MODE="remote"

REMOTE="backup-reader@source.example.invalid"
REMOTE_SSH_KEY="/root/.ssh/source-backup"
REMOTE_PREPARE="sudo /usr/local/sbin/source-backup-prepare.sh"
REMOTE_CLEAN="sudo /usr/local/sbin/source-backup-clean.sh"
REMOTE_EXPORT="/var/lib/source-backup/export/"
REMOTE_CLEAN_AFTER_PULL="yes"

RESTIC_REPOSITORY="/mnt/backup-storage/backups/restic/server-a"
RESTIC_PASSWORD_FILE="/root/.config/restic/server-a-password"

KEEP_DAILY=5
KEEP_WEEKLY=2
KEEP_MONTHLY=3
MAX_AGE_HOURS=30
