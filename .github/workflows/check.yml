name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and syntax
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh hooks/mariadb hooks/postgresql hooks/mongodb
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y restic rsync
      - name: Disposable Linux backup and restore
        run: python3 tests/integration.py
