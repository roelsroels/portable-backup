name: Source parity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original runtime and isolated command behavior
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate example text and HTML
        run: |
          python3 docs/examples/generate.py
          git diff --exit-code -- docs/examples
      - name: Verify distribution manifest
        run: sha256sum -c MANIFEST.sha256
